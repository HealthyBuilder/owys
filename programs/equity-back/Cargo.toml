[package]
name = "equity-back"
version = "0.1.0"
description = "Equity-Back Card: spend at a company, own a piece of it"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "equity_back"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
